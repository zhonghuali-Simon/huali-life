<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>杭州出行打卡地图 · 阿里人周末探店</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#05070d;--panel:#0b1020;--line:#1b2740;--txt:#cfe3ff;--dim:#7f92b5;--neon:#39ff14;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt)}
#app{display:flex;height:100vh;overflow:hidden}
#side{width:320px;min-width:320px;background:linear-gradient(180deg,#0b1020,#070a14);border-right:1px solid var(--line);display:flex;flex-direction:column;box-shadow:0 0 30px rgba(57,255,20,.08) inset}
#head{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
#head h1{font-size:18px;letter-spacing:1px;background:linear-gradient(90deg,#39ff14,#00e5ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 18px rgba(57,255,20,.25)}
#head p{font-size:11px;color:var(--dim);margin-top:4px}
.scan{position:relative;overflow:hidden}
.scan:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(57,255,20,.02) 3px 4px);pointer-events:none}
#ctrl{flex:1;overflow-y:auto;padding:14px 16px}
#ctrl::-webkit-scrollbar{width:6px}#ctrl::-webkit-scrollbar-thumb{background:#1e2c47;border-radius:3px}
.sec{margin-bottom:18px}
.sec h2{font-size:12px;color:var(--neon);letter-spacing:1px;margin-bottom:8px;text-transform:uppercase}
#search{width:100%;background:#070c17;border:1px solid var(--line);color:var(--txt);padding:9px 10px;border-radius:8px;font-size:13px;outline:none}
#search:focus{border-color:var(--neon);box-shadow:0 0 12px rgba(57,255,20,.25)}
.board{display:flex;flex-wrap:wrap;gap:6px}
.chip{cursor:pointer;font-size:11.5px;padding:6px 9px;border:1px solid var(--line);border-radius:20px;background:#0a1122;color:var(--dim);transition:.15s;user-select:none}
.chip:hover{border-color:#2c3f63;color:var(--txt)}
.chip.on{background:rgba(57,255,20,.12);border-color:var(--neon);color:var(--neon);box-shadow:0 0 10px rgba(57,255,20,.3)}
.cat{display:flex;align-items:center;gap:8px;padding:6px 4px;cursor:pointer;border-radius:6px}
.cat:hover{background:#0d1526}
.cat .dot{width:11px;height:11px;border-radius:50%;box-shadow:0 0 8px currentColor;flex:none}
.cat .nm{font-size:13px;flex:1}
.cat .ct{font-size:11px;color:var(--dim)}
.cat.off{opacity:.35}
.cat.off .nm{text-decoration:line-through}
.switch{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);cursor:pointer;user-select:none;padding:4px 0}
.switch input{display:none}
.switch .tk{width:34px;height:18px;border-radius:10px;background:#182238;border:1px solid var(--line);position:relative;transition:.2s;flex:none}
.switch .tk:after{content:"";position:absolute;top:1px;left:1px;width:14px;height:14px;border-radius:50%;background:#4a5a7a;transition:.2s}
.switch input:checked+.tk{background:rgba(57,255,20,.25);border-color:var(--neon)}
.switch input:checked+.tk:after{left:17px;background:var(--neon);box-shadow:0 0 8px var(--neon)}
#stat{font-size:11px;color:var(--dim);padding:8px 16px;border-top:1px solid var(--line)}
#stat b{color:var(--neon)}
#stage{flex:1;position:relative}
#map{position:absolute;inset:0;background:#05070d}
#list{position:absolute;inset:0;overflow-y:auto;padding:16px;display:none;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;align-content:start;background:radial-gradient(1200px 600px at 70% -10%,rgba(0,229,255,.06),transparent),var(--bg)}
#list::-webkit-scrollbar{width:8px}#list::-webkit-scrollbar-thumb{background:#1e2c47;border-radius:4px}
/* 视图切换 */
#vtog{position:absolute;top:12px;right:12px;z-index:1200;display:flex;background:#0b1020cc;border:1px solid var(--line);border-radius:10px;overflow:hidden;backdrop-filter:blur(6px)}
#vtog button{background:transparent;border:none;color:var(--dim);font-size:13px;padding:8px 16px;cursor:pointer;font-family:inherit}
#vtog button.on{background:rgba(57,255,20,.15);color:var(--neon);text-shadow:0 0 8px rgba(57,255,20,.4)}
/* 卡片 */
.card{background:linear-gradient(160deg,#0c1324,#080c17);border:1px solid var(--line);border-left:3px solid #444;border-radius:12px;padding:13px 14px;display:flex;flex-direction:column;gap:7px;transition:.15s;position:relative}
.card:hover{border-color:#2c3f63;transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.c-top{display:flex;align-items:flex-start;gap:7px}
.c-dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 8px currentColor;margin-top:5px;flex:none}
.c-nm{font-size:15px;font-weight:700;color:#fff;flex:1;line-height:1.3}
.cpy{background:#111a2e;border:1px solid var(--line);color:var(--dim);border-radius:6px;font-size:11px;padding:2px 7px;cursor:pointer;flex:none;transition:.15s}
.cpy:hover{border-color:var(--neon);color:var(--neon)}
.c-tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:11px}
.c-tags .tg{padding:1px 7px;border-radius:9px;background:rgba(0,229,255,.1);color:#7fd8ff;border:1px solid rgba(0,229,255,.25)}
.c-tags .st{color:#ffe500}
.c-loc{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
.c-loc span{flex:1}
.c-meta{font-size:11.5px;color:#93a7c9}
.c-rv{font-size:12px;color:#cfe0ff;line-height:1.5;padding-left:8px;border-left:2px solid #ffe50066}
.c-wh{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--dim);margin-top:2px}
.c-wh .bar{flex:1;height:5px;border-radius:3px;background:#16203a;overflow:hidden}
.c-wh .bar i{display:block;height:100%;background:linear-gradient(90deg,#00e5ff,#39ff14);box-shadow:0 0 8px rgba(57,255,20,.5)}
.c-badges{display:flex;flex-wrap:wrap;gap:4px}
.badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;background:rgba(57,255,20,.12);color:var(--neon);border:1px solid rgba(57,255,20,.3)}
.c-actions{display:flex;gap:6px;margin-top:2px}
.c-actions button{flex:1;background:#0e1830;border:1px solid var(--line);color:var(--dim);border-radius:7px;font-size:11px;padding:5px;cursor:pointer;font-family:inherit;transition:.15s}
.c-actions button:hover{border-color:var(--neon);color:var(--neon)}
/* 地图弹窗 */
.leaflet-popup-content-wrapper{background:#0b1020;color:var(--txt);border:1px solid var(--neon);border-radius:10px;box-shadow:0 0 24px rgba(57,255,20,.25)}
.leaflet-popup-tip{background:#0b1020;border:1px solid var(--neon)}
.leaflet-popup-content{margin:12px 14px;font-size:12.5px;line-height:1.55;width:250px!important}
.pp-nm{font-size:15px;font-weight:700;color:#fff;margin-bottom:2px}
.pp-tag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:10px;margin:3px 4px 3px 0;background:rgba(0,229,255,.12);color:#00e5ff;border:1px solid rgba(0,229,255,.35)}
.pp-meta{color:var(--dim);font-size:11px;margin:6px 0}
.pp-rv{color:#ffe500;font-size:12px;margin:6px 0;padding-left:8px;border-left:2px solid #ffe500}
.pp-tip{color:#bcd;font-size:11.5px;margin-top:4px}
.pp-src{color:#556; font-size:10px;margin-top:6px}
.pp-cpy{margin-top:8px;background:#0e1830;border:1px solid var(--line);color:var(--neon);border-radius:6px;font-size:11px;padding:4px 8px;cursor:pointer}
.mk{border-radius:50%;border:2px solid #fff;box-shadow:0 0 10px currentColor,0 0 4px rgba(0,0,0,.6)}
/* 常驻名称标注 */
.leaflet-tooltip.nlbl{background:rgba(6,10,18,.72);border:1px solid rgba(57,255,20,.35);color:#eafff0;font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px;box-shadow:0 0 8px rgba(0,0,0,.5);white-space:nowrap;text-shadow:0 0 6px rgba(57,255,20,.4);backdrop-filter:blur(2px);pointer-events:none}
.leaflet-tooltip.nlbl:before{display:none}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:#0b1020;border:1px solid var(--neon);color:var(--neon);padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:3000;box-shadow:0 0 20px rgba(57,255,20,.3)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* 社群入口 */
#joinBtn{position:absolute;left:12px;bottom:12px;z-index:1300;display:flex;align-items:center;gap:7px;background:linear-gradient(135deg,#0b1020,#111a30);border:1px solid var(--neon);color:var(--neon);padding:9px 14px;border-radius:24px;font-size:13px;cursor:pointer;font-family:inherit;box-shadow:0 0 16px rgba(57,255,20,.25);transition:.15s;animation:pulse 2.4s infinite}
#joinBtn:hover{box-shadow:0 0 26px rgba(57,255,20,.5);transform:translateY(-1px)}
@keyframes pulse{0%,100%{box-shadow:0 0 12px rgba(57,255,20,.2)}50%{box-shadow:0 0 24px rgba(57,255,20,.5)}}
#mask{position:fixed;inset:0;background:rgba(3,5,10,.82);backdrop-filter:blur(4px);z-index:4000;display:none;align-items:center;justify-content:center}
#mask.show{display:flex}
.modal{width:340px;max-width:90vw;background:linear-gradient(160deg,#0c1426,#080c17);border:1px solid var(--neon);border-radius:16px;padding:22px;position:relative;box-shadow:0 0 40px rgba(57,255,20,.25);text-align:center}
.modal .x{position:absolute;top:10px;right:14px;color:var(--dim);font-size:20px;cursor:pointer;line-height:1}
.modal .x:hover{color:var(--neon)}
.modal h3{font-size:17px;color:#fff;margin-bottom:2px}
.modal .sub{font-size:11.5px;color:var(--dim);margin-bottom:14px}
.modal .qr{width:220px;height:220px;border-radius:12px;background:#fff;padding:8px;margin:0 auto;display:block}
.modal .gno{margin:14px 0 4px;font-size:12px;color:var(--dim)}
.modal .gno b{color:var(--neon);font-size:15px;letter-spacing:1px}
.modal .cpy2{background:#111a2e;border:1px solid var(--line);color:var(--dim);border-radius:6px;font-size:11px;padding:2px 8px;cursor:pointer;margin-left:6px}
.modal .cpy2:hover{border-color:var(--neon);color:var(--neon)}
.modal .join{display:block;margin-top:16px;background:linear-gradient(90deg,#39ff14,#00e5ff);color:#04120a;font-weight:700;text-decoration:none;padding:11px;border-radius:10px;font-size:14px;box-shadow:0 0 18px rgba(57,255,20,.4)}
.modal .tip2{font-size:10.5px;color:#5a6b8a;margin-top:10px;line-height:1.5}
@media(max-width:720px){#side{position:absolute;z-index:1000;height:100%;transform:translateX(-100%);transition:.3s}#side.open{transform:none}#toggle{display:block!important}#list{grid-template-columns:1fr}}
#toggle{display:none;position:absolute;top:12px;left:12px;z-index:1100;background:#0b1020;border:1px solid var(--neon);color:var(--neon);padding:8px 12px;border-radius:8px;cursor:pointer}
</style>
</head>
<body>

    <div id="head">

    <div id="list"></div>
    <div id="vtog">

  <button id="toggle">☰ 筛选</button>
</div>
<div id="toast"></div>

const vmap=document.getElementById('vmap'),vlist=document.getElementById('vlist');
const elMap=document.getElementById('map'),elList=document.getElementById('list');
function setView(v){
  state.view=v;
  vmap.classList.toggle('on',v==='map');vlist.classList.toggle('on',v==='list');
  elMap.style.display=(v==='map')?'block':'none';
  elList.style.display=(v==='list')?'grid':'none';
  document.getElementById('hint').textContent=(v==='map')?'点击圆点看点评':'点击卡片按钮可复制';
  if(v==='map'){setTimeout(()=>map.invalidateSize(),50);}
  render();
}
vmap.onclick=()=>setView('map');vlist.onclick=()=>setView('list');

function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function costTxt(x){return (x.cost==='0'||x.cost==='')?'免费/低消':('人均'+x.cost+'元');}
function stars(x){return x.rating?('⭐'.repeat(Math.min(5,parseInt(x.rating)||0))):'';}
function fullText(x){
  return [x.name,x.type+' / '+x.area,'📍'+x.loc,costTxt(x)+(x.drive?(' · 阿里出发约'+x.drive+'分钟'):''),
    x.review?('点评：'+x.review):'',x.tip?('Tips：'+x.tip):''].filter(Boolean).join('\n');
}
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1400);}
function copyText(s,label){
  const done=()=>toast('已复制'+(label?('：'+label):''));
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(done).catch(()=>fallback(s,done));}
  else fallback(s,done);
}
function fallback(s,cb){const ta=document.createElement('textarea');ta.value=s;ta.style.position='fixed';ta.style.opacity=0;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');cb();}catch(e){}document.body.removeChild(ta);}
window.__copy=copyText;window.__full=i=>copyText(fullText(DATA[i]),DATA[i].name);

// 弹窗
function popup(x){
  let bd=(x.rank||[]).map(r=>`<span class="badge">${esc(r)}</span>`).join('');
  let i=DATA.indexOf(x);
  return `<div class="pp-nm">${esc(x.name)}</div>
  <span class="pp-tag">${esc(x.type)}</span><span class="pp-tag">${esc(x.area)}</span><span class="pp-tag">网感${x.wh||0}</span>
  <div class="pp-meta">${esc(x.loc)}</div>
  <div class="pp-meta">${stars(x)} ${stars(x)?' · ':''}${costTxt(x)}${x.drive?(' · 阿里出发约'+esc(x.drive)+'分钟'):''}</div>
  ${x.review?`<div class="pp-rv">${esc(x.review)}</div>`:''}
  ${x.tip?`<div class="pp-tip">${esc(x.tip)}</div>`:''}
  ${bd?`<div style="margin-top:6px">${bd}</div>`:''}
  ${x.src?`<div class="pp-src">来源：${esc(x.src)}</div>`:''}
  <button class="pp-cpy" onclick="window.__full(${i})">⧉ 复制信息</button>`;
}
// 卡片
function card(x){
  let i=DATA.indexOf(x);
  let bd=(x.rank||[]).map(r=>`<span class="badge">${esc(r)}</span>`).join('');
  return `<div class="card" style="border-left-color:${x.color}">
    <div class="c-top"><span class="c-dot" style="color:${x.color};background:${x.color}"></span>
      <span class="c-nm">${esc(x.name)}</span>
      <button class="cpy" onclick="window.__copy('${esc(x.name).replace(/'/g,"\\'")}','名称')">⧉ 名称</button></div>
    <div class="c-tags"><span class="tg">${esc(x.type)}</span><span class="tg">${esc(x.area)}</span><span class="st">${stars(x)}</span></div>
    <div class="c-loc"><span>📍 ${esc(x.loc)}</span><button class="cpy" onclick="window.__copy('${esc(x.loc).replace(/'/g,"\\'")}','地址')">⧉</button></div>
    <div class="c-meta">${costTxt(x)}${x.drive?(' · 阿里出发约'+esc(x.drive)+'分钟'):''}</div>
    ${x.review?`<div class="c-rv">${esc(x.review)}</div>`:''}
    <div class="c-wh"><span>网感</span><div class="bar"><i style="width:${x.wh||0}%"></i></div><span>${x.wh||0}</span></div>
    ${bd?`<div class="c-badges">${bd}</div>`:''}
    <div class="c-actions"><button onclick="window.__full(${i})">⧉ 复制全部信息</button></div>
  </div>`;
}
function pass(x){
  if(!state.cats.has(x.group))return false;
  if(state.hideTrad && x.xhs==='传统景点')return false;
  if(state.board && !(x.rank||[]).includes(state.board))return false;
  if(state.q){const hay=(x.name+x.type+x.area+x.loc+(x.review||'')+(x.tip||'')).toLowerCase();if(!hay.includes(state.q))return false;}
  return true;
}
function render(){
  const rows=DATA.filter(pass);
  document.getElementById('shown').textContent=rows.length;
  if(state.view==='map'){
    layer.clearLayers();
    const z=map.getZoom();
    // 缩小时只给高网感/上榜点常驻标注，放大后全部显示，避免密集重叠
    const showAll=z>=13, showMid=z>=12;
    rows.forEach(x=>{
      const ranked=(x.rank||[]).length>0;
      const r=ranked?7:5;
      const m=L.circleMarker([x.lat,x.lng],{radius:r,color:x.color,weight:2,fillColor:x.color,fillOpacity:.55,className:'mk'});
      m.bindPopup(popup(x),{maxWidth:280});
      const perm=showAll||(showMid&&(x.wh||0)>=60)||ranked;
      m.bindTooltip(x.name,{permanent:perm,direction:'top',offset:[0,-6],className:'nlbl',opacity:1});
      layer.addLayer(m);
    });
  }else{
    elList.innerHTML=rows.length?rows.map(card).join(''):'<div style="color:#7f92b5;padding:30px">没有符合条件的打卡点，试试放宽筛选～</div>';
  }
}

setView('map');
</script>
</body>
</html>
