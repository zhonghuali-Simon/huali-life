<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>阿里人的周末地图（久坐会版）</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#f6f8fb;--panel:#ffffff;--line:#e3e8f0;--txt:#1f2b3d;--dim:#7b8798;--brand:#0f9d58;--brand2:#0b7bd4;--shadow:0 1px 3px rgba(20,30,50,.06),0 6px 20px rgba(20,30,50,.06);}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
#app{display:flex;height:100vh;overflow:hidden}
#side{width:320px;min-width:320px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;box-shadow:2px 0 12px rgba(20,30,50,.04)}
#head{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
#head h1{font-size:18px;letter-spacing:.5px;font-weight:800;background:linear-gradient(90deg,#0f9d58,#0b7bd4);-webkit-background-clip:text;background-clip:text;color:transparent}
#head p{font-size:11px;color:var(--dim);margin-top:4px}
.scan{position:relative;overflow:hidden}
#ctrl{flex:1;overflow-y:auto;padding:14px 16px}
#ctrl::-webkit-scrollbar{width:6px}#ctrl::-webkit-scrollbar-thumb{background:#d5dce6;border-radius:3px}
.sec{margin-bottom:18px}
.sec h2{font-size:12px;color:var(--dim);letter-spacing:.6px;margin-bottom:8px;font-weight:700}
#search{width:100%;background:#f2f5f9;border:1px solid var(--line);color:var(--txt);padding:9px 10px;border-radius:8px;font-size:13px;outline:none;transition:.15s}
#search::placeholder{color:#a6b1c0}
#search:focus{background:#fff;border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,157,88,.12)}
.board{display:flex;flex-wrap:wrap;gap:6px}
.chip{cursor:pointer;font-size:11.5px;padding:6px 9px;border:1px solid var(--line);border-radius:20px;background:#f7f9fc;color:#5b6878;transition:.15s;user-select:none}
.chip:hover{border-color:#bfcbd9;color:var(--txt);background:#fff}
.chip.on{background:rgba(15,157,88,.1);border-color:var(--brand);color:#0b7a44;font-weight:600}
.cat{display:flex;align-items:center;gap:8px;padding:6px 4px;cursor:pointer;border-radius:6px;transition:.12s}
.cat:hover{background:#f2f5f9}
.cat .dot{width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.9),0 1px 3px rgba(0,0,0,.18);flex:none}
.cat .nm{font-size:13px;flex:1}
.cat .ct{font-size:11px;color:var(--dim)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend .cat{padding:4px 8px;background:#f4f7fb;border:1px solid #e3e9f1;border-radius:14px;gap:6px}
.legend .cat .nm{flex:none}
.cat.off{opacity:.4}
.cat.off .nm{text-decoration:line-through}
.switch{display:flex;align-items:center;gap:8px;font-size:12px;color:#5b6878;cursor:pointer;user-select:none;padding:4px 0}
.switch input{display:none}
.switch .tk{width:34px;height:18px;border-radius:10px;background:#dfe5ee;border:1px solid var(--line);position:relative;transition:.2s;flex:none}
.switch .tk:after{content:"";position:absolute;top:1px;left:1px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.2s}
.switch input:checked+.tk{background:var(--brand);border-color:var(--brand)}
.switch input:checked+.tk:after{left:17px;background:#fff}
#stat{font-size:11px;color:var(--dim);padding:8px 16px;border-top:1px solid var(--line);background:#fbfcfe}
#stat b{color:var(--brand);font-size:12px}
#stage{flex:1;position:relative}
#map{position:absolute;inset:0;background:#f0f2f6}
.leaflet-tile-pane{filter:grayscale(.72) saturate(.5) brightness(1.08) contrast(.88)}
.leaflet-marker-pane,.leaflet-overlay-pane,.leaflet-tooltip-pane,.leaflet-popup-pane{filter:none}
#list{position:absolute;inset:0;overflow-y:auto;padding:16px;display:none;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;align-content:start;background:var(--bg)}
#list::-webkit-scrollbar{width:8px}#list::-webkit-scrollbar-thumb{background:#d5dce6;border-radius:4px}
/* 视图切换 */
#vtog{position:absolute;top:12px;right:12px;z-index:1200;display:flex;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:10px;overflow:hidden;backdrop-filter:blur(6px);box-shadow:var(--shadow)}
#vtog button{background:transparent;border:none;color:#5b6878;font-size:13px;padding:8px 16px;cursor:pointer;font-family:inherit}
#vtog button.on{background:var(--brand);color:#fff;font-weight:600}
/* 卡片 */
.card{background:#fff;border:1px solid var(--line);border-left:3px solid #ccc;border-radius:12px;padding:13px 14px;display:flex;flex-direction:column;gap:7px;transition:.15s;position:relative;box-shadow:var(--shadow)}
.card:hover{border-color:#c7d2e0;transform:translateY(-2px);box-shadow:0 6px 22px rgba(20,30,50,.1)}
.c-top{display:flex;align-items:flex-start;gap:7px}
.c-dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.9),0 1px 3px rgba(0,0,0,.18);margin-top:5px;flex:none}
.c-nm{font-size:15px;font-weight:700;color:#141d2b;flex:1;line-height:1.3}
.cpy{background:#f2f5f9;border:1px solid var(--line);color:#6b7787;border-radius:6px;font-size:11px;padding:2px 7px;cursor:pointer;flex:none;transition:.15s}
.cpy:hover{border-color:var(--brand);color:var(--brand);background:rgba(15,157,88,.07)}
.c-tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:11px}
.c-tags .tg{padding:1px 7px;border-radius:9px;background:#eef4fb;color:#3a6b9c;border:1px solid #d9e6f4}
.c-tags .st{color:#e8a300}
.c-loc{font-size:12px;color:#6b7787;display:flex;align-items:center;gap:6px}
.c-loc span{flex:1}
.c-meta{font-size:11.5px;color:#5b6878}
.c-rv{font-size:12px;color:#33414f;line-height:1.5;padding-left:8px;border-left:2px solid #ffd24d;background:#fffdf5;border-radius:0 6px 6px 0;padding:4px 8px}
.c-wh{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--dim);margin-top:2px}
.c-wh .bar{flex:1;height:5px;border-radius:3px;background:#e8edf4;overflow:hidden}
.c-wh .bar i{display:block;height:100%;background:linear-gradient(90deg,#0b7bd4,#0f9d58);border-radius:3px}
.c-badges{display:flex;flex-wrap:wrap;gap:4px}
.badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;background:rgba(15,157,88,.09);color:#0b7a44;border:1px solid rgba(15,157,88,.22)}
.c-actions{display:flex;gap:6px;margin-top:2px}
.c-actions button{flex:1;background:#f5f8fc;border:1px solid var(--line);color:#5b6878;border-radius:7px;font-size:11px;padding:5px;cursor:pointer;font-family:inherit;transition:.15s}
.c-actions button:hover{border-color:var(--brand);color:var(--brand);background:rgba(15,157,88,.07)}
/* 地图弹窗 */
.leaflet-popup-content-wrapper{background:#fff;color:var(--txt);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(20,30,50,.16)}
.leaflet-popup-tip{background:#fff;border:1px solid var(--line);box-shadow:none}
.leaflet-popup-content{margin:12px 14px;font-size:12.5px;line-height:1.55;width:250px!important}
.pp-nm{font-size:15px;font-weight:700;color:#141d2b;margin-bottom:2px}
.pp-tag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:10px;margin:3px 4px 3px 0;background:#eef4fb;color:#3a6b9c;border:1px solid #d9e6f4}
.pp-meta{color:#6b7787;font-size:11px;margin:6px 0}
.pp-rv{color:#5c4708;font-size:12px;margin:6px 0;padding:4px 8px;border-left:2px solid #ffc93c;background:#fffdf3;border-radius:0 6px 6px 0}
.pp-tip{color:#4a5766;font-size:11.5px;margin-top:4px;line-height:1.5}
.pp-src{color:#9aa5b4;font-size:10px;margin-top:6px}
.pp-cpy{margin-top:8px;background:#f5f8fc;border:1px solid var(--line);color:var(--brand);border-radius:6px;font-size:11px;padding:4px 8px;cursor:pointer}
.pp-cpy:hover{background:rgba(15,157,88,.08);border-color:var(--brand)}
.mk{border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(20,30,50,.18),0 2px 6px rgba(20,30,50,.22)}
/* 常驻名称标注 */
.leaflet-tooltip.nlbl{background:rgba(255,255,255,.92);border:1px solid #dbe2ec;color:#243244;font-size:10px;font-weight:700;padding:0 4px;border-radius:5px;box-shadow:0 1px 3px rgba(20,30,50,.12);white-space:nowrap;backdrop-filter:blur(2px);pointer-events:none}
.leaflet-tooltip.nlbl:before{display:none}
.leaflet-control-zoom a{background:#fff!important;color:#33414f!important;border-color:var(--line)!important}
.leaflet-control-zoom a:hover{background:#f2f5f9!important}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:#1f2b3d;border:1px solid #1f2b3d;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:3000;box-shadow:0 8px 24px rgba(20,30,50,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:720px){#side{position:absolute;z-index:1000;height:100%;transform:translateX(-100%);transition:.3s;box-shadow:6px 0 24px rgba(20,30,50,.12)}#side.open{transform:none}#toggle{display:block!important}#list{grid-template-columns:1fr}}
#toggle{display:none;position:absolute;top:12px;left:12px;z-index:1100;background:#fff;border:1px solid var(--line);color:var(--txt);padding:8px 12px;border-radius:8px;cursor:pointer;box-shadow:var(--shadow)}
</style>
</head>

</div>

function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function costTxt(x){return (x.cost==='0'||x.cost==='')?'免费/低消':('人均'+x.cost+'元');}
function stars(x){return x.rating?('⭐'.repeat(Math.min(5,parseInt(x.rating)||0))):'';}
function activityText(x){return [x.kind==='活动'?'活动':'',x.access?('参与：'+x.access):'',x.booking?('预约：'+x.booking):''].filter(Boolean).join(' · ');}
function fullText(x){
  return [x.name,x.type+' / '+x.area,'📍'+x.loc,costTxt(x)+(x.drive?(' · 阿里出发约'+x.drive+'分钟'):''),
    activityText(x),x.review?('点评：'+x.review):'',x.tip?('Tips：'+x.tip):''].filter(Boolean).join('\n');
}
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1400);}
function copyText(s,label){
  const done=()=>toast('已复制'+(label?('：'+label):''));
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(done).catch(()=>fallback(s,done));}
  else fallback(s,done);
}
function fallback(s,cb){const ta=document.createElement('textarea');ta.value=s;ta.style.position='fixed';ta.style.opacity=0;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');cb();}catch(e){}document.body.removeChild(ta);}
window.__copy=copyText;window.__full=i=>copyText(fullText(DATA[i]),DATA[i].name);

  let i=DATA.indexOf(x);
  return `<div class="pp-nm">${esc(x.name)}</div>
  <span class="pp-tag">${esc(x.type)}</span><span class="pp-tag">${esc(x.area)}</span>${x.kind==='活动'?'<span class="pp-tag" style="background:#fff3d8;border-color:#e8b95c;color:#815b13">活动</span>':''}<span class="pp-tag">网感${x.wh||0}</span>${x.chain&&x.chain.indexOf('连锁')>=0?'<span class="pp-tag" title="连锁店只进明细，不进精选推荐">连锁</span>':''}${x.hm?`<span class="pp-tag" style="background:#e8f9ee;border-color:#9fdcb6;color:#1d6b42">🤝${esc(x.hm)}</span>`:''}
  <div class="pp-meta">${esc(x.loc)}</div>
  <div class="pp-meta">${stars(x)} ${stars(x)?' · ':''}${costTxt(x)}${x.drive?(' · 阿里出发约'+esc(x.drive)+'分钟'):''}</div>
  ${activityText(x)?`<div class="pp-meta">${esc(activityText(x))}</div>`:''}
  ${x.hmr?`<div class="pp-rv" style="background:#f2fbf5;border-left:3px solid #2ec167">同事手搓：${esc(x.hmr)}</div>`:''}
  ${x.review&&x.review!==x.hmr?`<div class="pp-rv">${esc(x.review)}</div>`:''}
  ${x.tip?`<div class="pp-tip">${esc(x.tip)}</div>`:''}
  ${bd?`<div style="margin-top:6px">${bd}</div>`:''}
  ${x.src?`<div class="pp-src">来源：${esc(x.src)}</div>`:''}
  <button class="pp-cpy" onclick="window.__full(${i})">⧉ 复制信息</button>`;
}
// 卡片
function card(x){
  let i=DATA.indexOf(x);
  let bd=(x.rank||[]).map(r=>`<span class="badge">${esc(r)}</span>`).join('');
  return `<div class="card" style="border-left-color:${x.color}">
    <div class="c-top"><span class="c-dot" style="color:${x.color};background:${x.color}"></span>
      <span class="c-nm">${esc(x.name)}</span>
      <button class="cpy" onclick="window.__copy('${esc(x.name).replace(/'/g,"\\'")}','名称')">⧉ 名称</button></div>
    <div class="c-tags"><span class="tg">${esc(x.type)}</span><span class="tg">${esc(x.area)}</span>${x.kind==='活动'?'<span class="tg" style="background:#fff3d8;border-color:#e8b95c;color:#815b13">活动</span>':''}${x.chain&&x.chain.indexOf('连锁')>=0?'<span class="tg">连锁</span>':''}${x.hm?`<span class="tg" style="background:#e8f9ee;border-color:#9fdcb6;color:#1d6b42">🤝${esc(x.hm)}</span>`:''}<span class="st">${stars(x)}</span></div>
    <div class="c-loc"><span>📍 ${esc(x.loc)}</span><button class="cpy" onclick="window.__copy('${esc(x.loc).replace(/'/g,"\\'")}','地址')">⧉</button></div>
    <div class="c-meta">${costTxt(x)}${x.drive?(' · 阿里出发约'+esc(x.drive)+'分钟'):''}</div>
    ${activityText(x)?`<div class="c-meta">${esc(activityText(x))}</div>`:''}
    ${x.hmr?`<div class="c-rv" style="background:#f2fbf5;border-left:3px solid #2ec167;padding-left:8px">同事手搓：${esc(x.hmr)}</div>`:''}
    ${x.review&&x.review!==x.hmr?`<div class="c-rv">${esc(x.review)}</div>`:''}
    <div class="c-wh"><span>网感</span><div class="bar"><i style="width:${x.wh||0}%"></i></div><span>${x.wh||0}</span></div>
    ${bd?`<div class="c-badges">${bd}</div>`:''}
    <div class="c-actions"><button onclick="window.__full(${i})">⧉ 复制全部信息</button></div>
  </div>`;
}
function pass(x){
  if(!state.cats.has(x.group))return false;
  if(state.sec && x.sec!==state.sec)return false;
  if(state.onlyHm && !x.hm)return false;
  if(state.hideTrad && x.xhs==='传统景点')return false;
  if(state.board && !(x.rank||[]).includes(state.board))return false;
  if(state.q){const hay=(x.name+x.type+x.area+x.loc+(x.review||'')+(x.tip||'')+(x.hmr||'')+(x.kind||'')+(x.access||'')+(x.booking||'')).toLowerCase();if(!hay.includes(state.q))return false;}
  return true;
}
// 点名短标注：优先用数据里预生成的 sn（人工校准，保证可识别）；兜底算法按 token 截断，不切断英文单词
function abbr(n){
  let s=String(n||'').replace(/[（(【][^)）】]*[)）】]/g,'').replace(/[（(【].*$/,'').trim();
  s=s.split(/[·・\/→>|,，]/)[0].trim();
  const lim=/[\u4e00-\u9fa5]/.test(s)?7:14;
  const tk=s.match(/[A-Za-z0-9%&'.\-]+|[\u4e00-\u9fa5]|./g)||[];
  let out='',w=0;
  for(const t of tk){const k=/[\u4e00-\u9fa5]/.test(t)?1:t.length;if(w+k>lim)break;out+=t;w+=k;}
  return out.trim().replace(/[·\-\s]+$/,'')||String(n).slice(0,5);
}
function label(x){return x.sn||abbr(x.name);}
function permanentLabelIds(rows){
  const z=map.getZoom(),bounds=map.getBounds().pad(.04),size=map.getSize();
  const visible=rows.filter(x=>bounds.contains([x.lat,x.lng]));
  const narrowed=!!(state.board||state.q||state.sec||state.onlyHm||state.hideTrad||state.cats.size<GROUPS.length);
  if(narrowed&&visible.length<=32)return new Set(visible.map(x=>x.id));
  const budget=z>=14?140:z===13?90:z===12?52:z===11?28:z===10?16:10;
  const sorted=[...visible].sort((a,b)=>{
    const ar=(a.rank||[]).length>0,br=(b.rank||[]).length>0;
    return Number(br)-Number(ar)||(b.wh||0)-(a.wh||0)||(b.rating||0)-(a.rating||0);
  });
  const boxes=[],picked=new Set();
  for(const x of sorted){
    if(picked.size>=budget)break;
    const p=map.latLngToContainerPoint([x.lat,x.lng]),txt=label(x);
    const textW=Math.max(42,[...txt].reduce((n,c)=>n+(/[\u4e00-\u9fa5]/.test(c)?13:7),0));
    const box={l:p.x-textW/2-8,r:p.x+textW/2+8,t:p.y-34,b:p.y-5};
    if(box.r<0||box.l>size.x||box.b<0||box.t>size.y)continue;
    const hit=boxes.some(o=>!(box.r<o.l||box.l>o.r||box.b<o.t||box.t>o.b));
    if(!hit){boxes.push(box);picked.add(x.id);}
  }
  return picked;
}
function render(){
  const rows=DATA.filter(pass);
  document.getElementById('shown').textContent=rows.length;
  if(state.view==='map'){
    layer.clearLayers();
    const permanent=permanentLabelIds(rows);
    rows.forEach(x=>{
      const ranked=(x.rank||[]).length>0;
      const r=ranked?7:5;
      const m=L.circleMarker([x.lat,x.lng],{radius:r,color:x.color,weight:2,fillColor:x.color,fillOpacity:.85,className:'mk'});
      m.bindPopup(popup(x),{maxWidth:280});
      m.bindTooltip(label(x),{permanent:permanent.has(x.id),direction:'top',offset:[0,-6],className:'nlbl',opacity:1});
      layer.addLayer(m);
    });
  }else{
    elList.innerHTML=rows.length?rows.map(card).join(''):'<div style="color:#7b8798;padding:30px">没有符合条件的打卡点，试试放宽筛选～</div>';
  }
}

setView('map');
</script>
