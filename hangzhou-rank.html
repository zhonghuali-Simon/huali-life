const META = {"boards":["阿里人周末出行榜","杭州网红打卡点","周末运动热门榜","咖啡厅打卡榜","店破但便宜好吃小馆","杭州本地人常吃面馆","群主觉得不错榜"],"icon":{"阿里人周末出行榜":"🎒","杭州网红打卡点":"📸","周末运动热门榜":"🏃","咖啡厅打卡榜":"☕","店破但便宜好吃小馆":"🍜","杭州本地人常吃面馆":"🥢","群主觉得不错榜":"👑"},"sub":{"阿里人周末出行榜":"园区出发，两小时圈内一网打尽","杭州网红打卡点":"确实网红，去了确实要排队","周末运动热门榜":"把久坐的债还一点回去","咖啡厅打卡榜":"咖啡是次要的，出片是主要的","店破但便宜好吃小馆":"环境扣分，味道满分","杭州本地人常吃面馆":"一碗面的时间，够把班味吐完","群主觉得不错榜":"群主自费踩过的，翻车概率低"},"gc":{"美食":"#ff9100","户外运动":"#ff3860","自然山水":"#39ff14","咖啡":"#00e5ff","古镇人文":"#c792ea","潮流地标":"#ffe500","艺术展览":"#ff4dd2"}};
const $ = s => document.querySelector(s);
let cur = META.boards[0], sortKey = 's', q = '';

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function cnt(b){return DATA.filter(x=>x.b.indexOf(b)>=0).length;}

// KPI
(() => {
  const avg = (DATA.reduce((a,x)=>a+x.s,0)/DATA.length).toFixed(1);
  const food = DATA.filter(x=>x.g==='美食').length;
  const free = DATA.filter(x=>x.p===0).length;
  const near = DATA.filter(x=>x.d>0&&x.d<=30).length;
  $('#kpi').innerHTML = [['点位总数',DATA.length],['平均口碑分',avg],['榜单数',META.boards.length],
    ['美食点位',food],['0元可去',free],['30分钟内可达',near]]
    .map(([k,v])=>`<div><b>${v}</b>${k}</div>`).join('');
})();

// 总览条
(() => {
  const rows = META.boards.map(b=>({b,c:cnt(b)})).sort((x,y)=>y.c-x.c);
  const mx = Math.max(...rows.map(r=>r.c));
  $('#ovbars').innerHTML = rows.map(r=>
    `<div class="mrow"><div class="mt">${META.icon[r.b]||''} ${esc(r.b)}</div>
     <div class="mb"><i data-w="${(r.c/mx*100).toFixed(1)}%"></i></div>
     <div class="mv">${r.c}</div></div>`).join('');
  setTimeout(()=>document.querySelectorAll('#ovbars .mb i').forEach(e=>e.style.width=e.dataset.w),80);
})();

// tabs
$('#tabs').innerHTML = META.boards.map(b=>
  `<div class="tab" data-b="${esc(b)}">${META.icon[b]||''} ${esc(b)}<i>${cnt(b)}</i></div>`).join('');
$('#tabs').addEventListener('click', e=>{
  const t = e.target.closest('.tab'); if(!t) return;
  cur = t.dataset.b; render();
});
document.querySelectorAll('.sortbtn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.sortbtn').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); sortKey = b.dataset.s; render();
}));
$('#q').addEventListener('input', e=>{ q = e.target.value.trim().toLowerCase(); render(); });

function money(p){return p===0?'0元可去':'人均 ¥'+p;}
function stars(r){return '★'.repeat(r)+'☆'.repeat(Math.max(0,5-r));}

function row(x, i, mx){
  const cls = i===0?'t1':i===1?'t2':i===2?'t3':'';
  const w = Math.max(8, x.s/mx*100).toFixed(1);
  return `<div class="row ${cls}">
    <div class="rk">${i+1}</div>
    <div>
      <div class="nm"><span class="dot" style="color:${x.c};background:${x.c}"></span>${esc(x.n)}
        <span class="tg">${esc(x.t)}</span><span class="tg">${esc(x.a)}</span><span class="tg">${esc(x.h)}</span></div>
      <div class="scline"><span class="lb">口碑分</span><span class="sc">${x.s}</span></div>
      <div class="track"><i class="fill" data-w="${w}%"></i></div>
      <div class="meta"><span>${money(x.p)}</span><span>车程 ${x.d||'—'} 分钟</span>
        <span>推荐 ${stars(x.r)}</span><span>网感 ${x.w}</span><span>出片 ${x.ph}/5</span></div>
      ${x.v?`<div class="rv">${esc(x.v)}</div>`:''}
    </div></div>`;
}

function render(){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.b===cur));
  $('#bt').textContent = (META.icon[cur]||'') + ' ' + cur;
  $('#bs').textContent = META.sub[cur] || '';
  let rows = DATA.filter(x=>x.b.indexOf(cur)>=0);
  if(q) rows = rows.filter(x=>(x.n+x.t+x.a+x.loc+x.v+x.why).toLowerCase().includes(q));
  if(sortKey==='s') rows.sort((a,b)=>b.s-a.s);
  else if(sortKey==='p') rows.sort((a,b)=>a.p-b.p||b.s-a.s);
  else rows.sort((a,b)=>(a.d||999)-(b.d||999)||b.s-a.s);
  const mx = Math.max(1, ...rows.map(x=>x.s));
  $('#list').innerHTML = rows.length?rows.map((x,i)=>row(x,i,mx)).join(''):'<div class="empty">这个榜单里没有匹配的点位，把搜索词删掉试试～</div>';
  requestAnimationFrame(()=>document.querySelectorAll('.fill').forEach(e=>e.style.width=e.dataset.w));
}
render();
</script>
